# Prüfung bei jedem Push auf main und jedem Pull Request: Typen, Tests, Web-Build.
# Kein Installer – der entsteht nur bei einer Freigabe (siehe release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
