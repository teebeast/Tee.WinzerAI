[package]
name = "winzerai"
version = "0.2.0"
description = "WinzerAI – rundenbasierte Weingut-Simulation"
authors = ["teebeast"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "winzerai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }

# Kleinere, schnellere Release-Exe
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
